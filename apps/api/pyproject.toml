[project]
name = "catalyst-api"
version = "0.1.0"
description = "CatalystAI API — protein design copilot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "sqlmodel>=0.0.22",
    "psycopg[binary]>=3.2.3",
    "alembic>=1.14.0",
    "redis>=5.2.1",
    "rq>=2.1.0",
    # Promoted from a test-only dependency: Phase 2 retrieves sequences and
    # structures from UniProt, RCSB and AlphaFold DB at runtime. It was already
    # present because FastAPI's TestClient is built on it.
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "mypy>=1.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catalyst"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = [
    # SQLModel/Pydantic field definitions are function calls in class bodies by design.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
# SQLModel's metaclass defeats a handful of strict-mode checks on table classes.
# Everything outside models/ is held to full strict.
[[tool.mypy.overrides]]
module = "catalyst.models.*"
disallow_untyped_defs = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["rq.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
